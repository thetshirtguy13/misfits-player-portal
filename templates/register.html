{% extends "base.html" %}{% block content %}<div class="auth card"><h1>Create Account</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Account type</label><select name="role" id="role"><option value="player">Player</option><option value="parent">Parent</option><option value="coach">Coach</option></select><label>Full name</label><input name="name" required><label>Email</label><input name="email" type="email" required><label>Password</label><input name="password" type="password" minlength="10" required><div id="playerFields"><label>Team join code</label><input name="join_code" placeholder="Get this code from your coach"><label>Parent/guardian email</label><input name="parent_email" type="email" placeholder="Required for player accounts"><label>Age group</label><select name="age_group"><option></option>{% for a in ['8U','9U','10U','11U','12U','13U','14U'] %}<option>{{a}}</option>{% endfor %}</select><label>Primary position</label><select name="position"><option></option>{% for p in ['Pitcher','Catcher','Infielder','Outfielder','Utility'] %}<option>{{p}}</option>{% endfor %}</select></div><button>Create Account</button></form><p class="muted small">Players use a team code to join. Youth player accounts require parent/guardian consent before progress can be recorded.</p></div><script>document.getElementById('role').addEventListener('change',e=>document.getElementById('playerFields').style.display=e.target.value==='player'?'block':'none')</script>{% endblock %}

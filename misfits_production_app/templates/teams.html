{% extends "base.html" %}{% block content %}<h1>Teams</h1><div class="card"><h2>Create Team</h2><form method="post" class="formgrid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input name="organization" placeholder="Organization" value="Misfits Baseball"><input name="name" placeholder="Team name" required><select name="age_group">{% for a in ['8U','9U','10U','11U','12U','13U','14U'] %}<option>{{a}}</option>{% endfor %}</select><button>Create Team</button></form></div><div class="cards">{% for t in teams %}<div class="card"><span class="pill">{{t.age_group}}</span><h2>{{t.name}}</h2><p>Player join code: <strong class="code">{{t.join_code}}</strong></p></div>{% else %}<div class="card"><p class="muted">No teams yet.</p></div>{% endfor %}</div>{% endblock %}
